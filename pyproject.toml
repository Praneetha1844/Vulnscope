[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnscope"
version = "0.1.0"
description = "Triage tool for SAST and dependency findings with human-reviewed remediation suggestions."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Praneetha Potharaju" }]
dependencies = ["pydantic>=2.6"]
keywords = ["security", "sast", "sca", "sarif", "triage"]

[project.urls]
Source = "https://github.com/Praneetha1844/Vulnscope"
Documentation = "https://github.com/Praneetha1844/Vulnscope/tree/main/docs"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7"]

[project.scripts]
vulnscope = "vulnscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
